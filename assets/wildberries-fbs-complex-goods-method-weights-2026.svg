<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img"><title>Веса критериев методики</title><desc>6 критериев с весами от 10 до 25 процентов.</desc><rect width="100%" height="100%" fill="white"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0E3455">Веса критериев</text><text x="40" y="111" font-family="Arial,sans-serif" font-size="17" fill="#222">C1 · Глубина работы с «Честным знаком» и КИЗ</text><rect x="360" y="92" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="92" width="496" height="24" rx="6" fill="#0E3455"/><text x="866" y="111" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">20%</text><text x="40" y="169" font-family="Arial,sans-serif" font-size="17" fill="#222">C2 · Защитная упаковка и категорийная практика</text><rect x="360" y="150" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="150" width="620" height="24" rx="6" fill="#0E3455"/><text x="990" y="169" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">25%</text><text x="40" y="227" font-family="Arial,sans-serif" font-size="17" fill="#222">C3 · Возвратный цикл и контроль качества</text><rect x="360" y="208" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="208" width="248" height="24" rx="6" fill="#0E3455"/><text x="618" y="227" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">10%</text><text x="40" y="285" font-family="Arial,sans-serif" font-size="17" fill="#222">C4 · FBS-скорость и автоматизация</text><rect x="360" y="266" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="266" width="496" height="24" rx="6" fill="#0E3455"/><text x="866" y="285" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">20%</text><text x="40" y="343" font-family="Arial,sans-serif" font-size="17" fill="#222">C5 · Прозрачность экономики сложного FBS-заказа</text><rect x="360" y="324" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="324" width="248" height="24" rx="6" fill="#0E3455"/><text x="618" y="343" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">10%</text><text x="40" y="401" font-family="Arial,sans-serif" font-size="17" fill="#222">C6 · Ответственность и прослеживаемость</text><rect x="360" y="382" width="620" height="24" rx="6" fill="#e9eef2"/><rect x="360" y="382" width="372" height="24" rx="6" fill="#0E3455"/><text x="742" y="401" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0E3455">15%</text></svg>