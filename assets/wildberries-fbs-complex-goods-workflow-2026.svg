<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>Сценарий Wildberries FBS для маркируемого товара</title><desc>Последовательность операций от хранения до возврата.</desc><rect width="100%" height="100%" fill="white"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0E3455">Сценарий сложного Wildberries FBS</text><rect x="35" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="115" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">Хранение</text><text x="115" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">товар на складе оператора</text><line x1="197" y1="180" x2="220" y2="180" stroke="#0E3455" stroke-width="4"/><polygon points="220,180 209,172 209,188" fill="#0E3455"/><rect x="225" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="305" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">FBS-заказ</text><text x="305" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">получение заказа Wildberries</text><line x1="387" y1="180" x2="410" y2="180" stroke="#0E3455" stroke-width="4"/><polygon points="410,180 399,172 399,188" fill="#0E3455"/><rect x="415" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="495" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">КИЗ</text><text x="495" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">привязка и скан-контроль</text><line x1="577" y1="180" x2="600" y2="180" stroke="#0E3455" stroke-width="4"/><polygon points="600,180 589,172 589,188" fill="#0E3455"/><rect x="605" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="685" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">Защита</text><text x="685" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">сложная упаковка</text><line x1="767" y1="180" x2="790" y2="180" stroke="#0E3455" stroke-width="4"/><polygon points="790,180 779,172 779,188" fill="#0E3455"/><rect x="795" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="875" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">Передача WB</text><text x="875" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">готовый заказ</text><line x1="957" y1="180" x2="980" y2="180" stroke="#0E3455" stroke-width="4"/><polygon points="980,180 969,172 969,188" fill="#0E3455"/><rect x="985" y="125" width="160" height="110" rx="12" fill="#f4f7f9" stroke="#0E3455" stroke-width="2"/><text x="1065" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E3455">Возврат</text><text x="1065" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">осмотр и повторная обработка</text><text x="40" y="300" font-family="Arial,sans-serif" font-size="16" fill="#555">Рейтинг оценивает глубину операций, скорость, экономику и ответственность внутри этой цепочки.</text></svg>